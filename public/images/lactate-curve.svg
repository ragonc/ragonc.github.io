<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace">
  <title id="t">How lactate climbs</title>
  <desc id="d">The classic lactate curve: blood lactate against running speed. At easy speeds lactate stays near its resting level of about 1 mmol/L. LT1 is where it first starts to rise; mine is at 5:30 to 5:40 per km and 152 bpm. Between LT1 and LT2 it rises slowly. LT2 is where the body produces more lactate than it can clear, classically near 4 mmol/L; mine is at 4:20 to 4:30 per km and 180 bpm. Above LT2 lactate climbs steeply. The curve shows the typical shape, not measured lab data. A second, dashed curve shows the same shape after months of training, shifted to faster speeds: both thresholds move right, so the same effort buys a faster pace.</desc>
  <defs>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ea43" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c3ea43" stop-opacity="0"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c3ea43"/></marker>
  </defs>
  <style>
    .bg{fill:#070a06}
    .ttl{fill:#eff3ee;font:800 24px 'Big Shoulders Display','Archivo Narrow',system-ui,sans-serif;letter-spacing:.02em}
    .sub{fill:#c7ccc6;font:400 14px Newsreader,Georgia,serif}
    .fig{fill:#eff3ee;font:800 30px 'Big Shoulders Display','Archivo Narrow',system-ui,sans-serif}
    .lbl{fill:#c7ccc6;font-size:12px}
    .mut{fill:#858b84;font-size:12px}
    .grid{stroke:#2b2f2b;stroke-width:1}
    .lead{stroke:#c7ccc6;stroke-opacity:.45;stroke-width:1}
    .drop{stroke:#c3ea43;stroke-opacity:.6;stroke-width:1.5;stroke-dasharray:4 4}
    .curve{fill:none;stroke:#eff3ee;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .pt{fill:#c3ea43;stroke:#070a06;stroke-width:3}
    .trained{fill:none;stroke:#c7ccc6;stroke-opacity:.6;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
    .tpt{fill:#070a06;stroke:#c7ccc6;stroke-opacity:.8;stroke-width:2}
    .shift{stroke:#c3ea43;stroke-width:1.5}
  </style>
  <rect class="bg" width="560" height="380"/>

  <text class="ttl" x="24" y="38">HOW LACTATE CLIMBS</text>
  <text class="sub" x="24" y="60">Flat when you run easy, steep past LT2. Training moves both to faster paces.</text>

  <!-- effort bands, same ramp as the pace chart: lime gets stronger as effort rises -->
  <rect x="56" y="100" width="216" height="240" fill="#c3ea43" fill-opacity=".03"/>
  <rect x="272" y="100" width="144" height="240" fill="#c3ea43" fill-opacity=".08"/>
  <rect x="416" y="100" width="120" height="240" fill="#c3ea43" fill-opacity=".15"/>

  <!-- y grid and ticks, mmol/L -->
  <g class="grid">
    <line x1="56" y1="294" x2="536" y2="294"/><line x1="56" y1="248" x2="536" y2="248"/>
    <line x1="56" y1="202" x2="536" y2="202"/><line x1="56" y1="156" x2="536" y2="156"/>
  </g>
  <g class="mut" text-anchor="end">
    <text x="48" y="298">2</text><text x="48" y="252">4</text><text x="48" y="206">6</text><text x="48" y="160">8</text>
  </g>
  <text class="mut" x="24" y="92">lactate, mmol/L</text>

  <!-- legend -->
  <line class="curve" x1="268" y1="88" x2="290" y2="88"/>
  <text class="lbl" x="298" y="92">Now</text>
  <line class="trained" x1="344" y1="88" x2="366" y2="88"/>
  <text class="lbl" x="374" y="92">After training</text>

  <!-- x axis -->
  <line x1="56" y1="340" x2="536" y2="340" stroke="#3f443f" stroke-width="1"/>
  <text class="mut" x="56" y="360">easy</text>
  <text class="mut" x="296" y="360" text-anchor="middle">running speed  →</text>
  <text class="mut" x="536" y="360" text-anchor="end">all out</text>

  <!-- after months of training: same shape, shifted to faster speeds -->
  <path class="trained" d="M56.0 317.8 L65.6 317.6 L75.2 317.4 L84.8 317.2 L94.4 317.0 L104.0 316.7 L113.6 316.5 L123.2 316.2 L132.8 315.8 L142.4 315.5 L152.0 315.1 L161.6 314.6 L171.2 314.2 L180.8 313.7 L190.4 313.1 L200.0 312.5 L209.6 311.8 L219.2 311.1 L228.8 310.3 L238.4 309.5 L248.0 308.5 L257.6 307.5 L267.2 306.4 L276.8 305.2 L286.4 303.9 L296.0 302.5 L305.6 300.9 L315.2 299.2 L324.8 297.3 L334.4 295.3 L344.0 293.1 L353.6 290.7 L363.2 288.1 L372.8 285.3 L382.4 282.2 L392.0 278.8 L401.6 275.1 L411.2 271.1 L420.8 266.7 L430.4 261.9 L440.0 256.7 L449.6 251.0 L459.2 244.8 L468.8 238.1 L478.4 230.8 L488.0 222.8 L497.6 214.0 L507.2 204.5 L516.8 194.2 L526.4 182.9 L536.0 170.6"><title>After months of training: the same curve, shifted to faster speeds</title></path>

  <!-- the curve now -->
  <path fill="url(#under)" d="M56.0 317.0 L80.0 316.3 L104.0 315.5 L128.0 314.4 L152.0 313.1 L176.0 311.5 L200.0 309.5 L224.0 307.0 L248.0 303.9 L272.0 300.1 L296.0 295.3 L320.0 289.4 L344.0 282.2 L368.0 273.1 L392.0 261.9 L416.0 248.0 L440.0 230.8 L464.0 209.4 L488.0 182.9 L512.0 150.1 L536.0 109.3 L536 340 L56 340 Z"/>
  <path class="curve" d="M56.0 317.0 L65.6 316.7 L75.2 316.5 L84.8 316.2 L94.4 315.8 L104.0 315.5 L113.6 315.1 L123.2 314.6 L132.8 314.2 L142.4 313.7 L152.0 313.1 L161.6 312.5 L171.2 311.8 L180.8 311.1 L190.4 310.3 L200.0 309.5 L209.6 308.5 L219.2 307.5 L228.8 306.4 L238.4 305.2 L248.0 303.9 L257.6 302.5 L267.2 300.9 L276.8 299.2 L286.4 297.3 L296.0 295.3 L305.6 293.1 L315.2 290.7 L324.8 288.1 L334.4 285.3 L344.0 282.2 L353.6 278.8 L363.2 275.1 L372.8 271.1 L382.4 266.7 L392.0 261.9 L401.6 256.7 L411.2 251.0 L420.8 244.8 L430.4 238.1 L440.0 230.8 L449.6 222.8 L459.2 214.0 L468.8 204.5 L478.4 194.2 L488.0 182.9 L497.6 170.6 L507.2 157.2 L516.8 142.6 L526.4 126.7 L536.0 109.3"/>

  <!-- band names, under the curve -->
  <text class="lbl" x="64" y="334">Easy, zone 2</text>
  <text class="lbl" x="280" y="334">Threshold work</text>
  <text class="lbl" x="424" y="334">Above LT2</text>

  <!-- the shift: each threshold moves to a faster speed -->
  <line class="shift" x1="280" y1="300.1" x2="302" y2="300.1" marker-end="url(#head)"/>
  <circle class="tpt" cx="310.4" cy="300.1" r="5"><title>LT1 after training</title></circle>
  <line class="shift" x1="424" y1="248" x2="446" y2="248" marker-end="url(#head)"/>
  <circle class="tpt" cx="454.4" cy="248" r="5"><title>LT2 after training</title></circle>

  <!-- LT1 -->
  <line class="drop" x1="272" y1="306" x2="272" y2="322"/>
  <line class="lead" x1="272" y1="226" x2="272" y2="292"/>
  <text class="fig" x="262" y="248" text-anchor="end">LT1</text>
  <text class="lbl" x="262" y="268" text-anchor="end">Lactate starts to rise</text>
  <text class="mut" x="262" y="284" text-anchor="end">Mine: 5:30-5:40/km, 152 bpm</text>
  <circle class="pt" cx="272" cy="300.1" r="6"><title>LT1: lactate starts to rise. Mine: 5:30-5:40 /km, 152 bpm</title></circle>

  <!-- LT2 -->
  <line class="drop" x1="416" y1="254" x2="416" y2="322"/>
  <line class="lead" x1="416" y1="112" x2="416" y2="240"/>
  <text class="fig" x="404" y="128" text-anchor="end">LT2</text>
  <text class="lbl" x="404" y="148" text-anchor="end">More lactate than you can clear</text>
  <text class="mut" x="404" y="164" text-anchor="end">Mine: 4:20-4:30/km, 180 bpm</text>
  <circle class="pt" cx="416" cy="248" r="6"><title>LT2: more lactate than you can clear. Mine: 4:20-4:30 /km, 180 bpm</title></circle>
</svg>
