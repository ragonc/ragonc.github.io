<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace">
  <title id="t">Where my paces sit</title>
  <desc id="d">My running paces on one line from 7:00 to 4:00 per km. Zone 2: 6:30 to 6:50 per km. First threshold, LT1: 5:30 to 5:40 per km at 152 bpm. Predicted half marathon: 4:38 per km, 1:37 to 1:38. Second threshold, LT2: 4:20 to 4:30 per km at 180 bpm. The runs behind the estimate: a 10K race at 4:26 per km and 180 bpm, a 5K time trial at 4:13 per km and 181 bpm. AI estimates from Garmin data, not a lab test.</desc>
  <style>
    .bg{fill:#070a06}
    .ttl{fill:#eff3ee;font:800 24px 'Big Shoulders Display','Archivo Narrow',system-ui,sans-serif;letter-spacing:.02em}
    .sub{fill:#c7ccc6;font:400 14px Newsreader,Georgia,serif}
    .fig{fill:#eff3ee;font:800 32px 'Big Shoulders Display','Archivo Narrow',system-ui,sans-serif}
    .fig2{fill:#eff3ee;font:800 28px 'Big Shoulders Display','Archivo Narrow',system-ui,sans-serif}
    .lbl{fill:#c7ccc6;font-size:12px}
    .mut{fill:#858b84;font-size:12px}
    .lead{stroke:#c7ccc6;stroke-opacity:.45;stroke-width:1}
    .lime{fill:#c3ea43}
    .run{fill:#070a06;stroke:#c7ccc6;stroke-width:2}
  </style>
  <rect class="bg" width="560" height="430"/>

  <text class="ttl" x="24" y="38">WHERE MY PACES SIT</text>
  <text class="sub" x="24" y="60">My paces per km, easy to all out, worked out by AI from my 10K and 5K.</text>

  <!-- thresholds, above the ribbon -->
  <text class="lbl" x="265.8" y="128" text-anchor="middle">LT1 at 152 bpm</text>
  <text class="fig" x="265.8" y="168" text-anchor="middle">5:30-5:40</text>
  <line class="lead" x1="265.8" y1="178" x2="265.8" y2="210"/>

  <text class="lbl" x="536" y="128" text-anchor="end">LT2 at 180 bpm</text>
  <text class="fig" x="536" y="168" text-anchor="end">4:20-4:30</text>
  <line class="lead" x1="464.9" y1="178" x2="464.9" y2="210"/>

  <!-- the ribbon: 7:00/km on the left, 4:00/km on the right; lime gets stronger as effort rises -->
  <text class="mut" x="24" y="204">7:00/km</text>
  <text class="mut" x="536" y="204" text-anchor="end">4:00/km</text>
  <g>
    <rect class="lime" x="24" y="214" width="26.4" height="14" rx="4" fill-opacity=".12"/>
    <rect class="lime" x="52.4" y="214" width="54.9" height="14" fill-opacity=".6"><title>Zone 2: 6:30-6:50 /km</title></rect>
    <rect class="lime" x="109.3" y="214" width="140.3" height="14" fill-opacity=".12"/>
    <rect class="lime" x="251.6" y="214" width="26.4" height="14"><title>LT1: 5:30-5:40 /km at 152 bpm</title></rect>
    <rect class="lime" x="280" y="214" width="168.7" height="14" fill-opacity=".26"/>
    <rect class="lime" x="450.7" y="214" width="26.4" height="14"><title>LT2: 4:20-4:30 /km at 180 bpm</title></rect>
    <rect class="lime" x="479.1" y="214" width="56.9" height="14" rx="4" fill-opacity=".45"/>
  </g>
  <line x1="427.9" y1="208" x2="427.9" y2="234" stroke="#eff3ee" stroke-width="2"><title>Half marathon, predicted: 4:38 /km</title></line>

  <!-- zone 2 and the half marathon, below the ribbon -->
  <line class="lead" x1="80.9" y1="232" x2="80.9" y2="262"/>
  <text class="fig2" x="24" y="294">6:30-6:50</text>
  <text class="lbl" x="24" y="314">Zone 2, easy runs</text>

  <line class="lead" x1="427.9" y1="236" x2="427.9" y2="262"/>
  <text class="fig2" x="427.9" y="294" text-anchor="middle">4:38</text>
  <text class="lbl" x="427.9" y="314" text-anchor="middle">Half marathon pace</text>
  <text class="mut" x="427.9" y="330" text-anchor="middle">predicted 1:37-1:38</text>

  <!-- the runs behind the estimate, on the same pace scale -->
  <text class="mut" x="24" y="360">The runs it used</text>
  <line x1="24" y1="374" x2="536" y2="374" stroke="#2b2f2b" stroke-width="1"/>
  <circle class="run" cx="462" cy="374" r="5"><title>10K race: 4:26 /km, 180 bpm</title></circle>
  <text class="lbl" x="468" y="396" text-anchor="end">10K race 4:26, 180 bpm</text>
  <circle class="run" cx="499" cy="374" r="5"><title>5K time trial: 4:13 /km, 181 bpm</title></circle>
  <text class="lbl" x="536" y="414" text-anchor="end">5K time trial 4:13, 181 bpm</text>
</svg>
