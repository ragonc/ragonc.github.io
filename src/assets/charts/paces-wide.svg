<svg id="paces-w" xmlns="http://www.w3.org/2000/svg" viewBox="24 110 512 312" role="img" aria-labelledby="paces-w-t paces-w-d" width="100%">
<title id="paces-w-t">Where my paces sit</title>
<desc id="paces-w-d">My running paces on one line from 7:00 to 4:00 per km. Zone 2: 6:30 to 6:50. LT1: 5:30 to 5:40 at 152 bpm. Predicted half marathon: 4:38, 1:37 to 1:38. LT2: 4:20 to 4:30 at 180 bpm. The runs it used: a 10K race at 4:26 and 180 bpm, a 5K time trial at 4:13 and 181 bpm. AI estimates from Garmin data.</desc>
<style>
#paces-w .fig{fill:var(--color-ink);font-family:var(--font-display);font-weight:700}
#paces-w .lbl{fill:var(--color-ink-2);font-family:var(--font-mono);font-size:12px}
#paces-w .mut{fill:var(--color-muted);font-family:var(--font-mono);font-size:12px}
#paces-w .lime{fill:var(--color-accent)}
#paces-w .lead{stroke:var(--color-ink-2);stroke-opacity:.45;stroke-width:1}
#paces-w .grid{stroke:var(--color-rule);stroke-width:1}
#paces-w .axis{stroke:var(--color-rule-2);stroke-width:1}
#paces-w .run{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:2}
#paces-w .curve{fill:none;stroke:var(--color-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#paces-w .trained{fill:none;stroke:var(--color-ink-2);stroke-opacity:.7;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
#paces-w .tpt{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:2}
#paces-w .pt{fill:var(--color-accent);stroke:var(--color-paper);stroke-width:3}
#paces-w .drop{stroke:var(--color-accent);stroke-opacity:.6;stroke-width:1.5;stroke-dasharray:4 4}
#paces-w .shift{stroke:var(--color-accent);stroke-width:1.5}
#paces-w .head{fill:var(--color-accent)}
</style>
<text class="lbl" x="265.8" y="128" text-anchor="middle">LT1 at 152 bpm</text>
<text class="fig" x="265.8" y="168" text-anchor="middle" font-size="36">5:30-5:40</text>
<line class="lead" x1="265.8" y1="178" x2="265.8" y2="210"/>
<text class="lbl" x="536" y="128" text-anchor="end">LT2 at 180 bpm</text>
<text class="fig" x="536" y="168" text-anchor="end" font-size="36">4:20-4:30</text>
<line class="lead" x1="464.9" y1="178" x2="464.9" y2="210"/>
<text class="mut" x="24" y="204">7:00/km</text>
<text class="mut" x="536" y="204" text-anchor="end">4:00/km</text>
<rect class="lime" x="24.0" y="214" width="26.4" height="14" fill-opacity="0.3"></rect>
<rect class="lime" x="52.4" y="214" width="54.9" height="14" fill-opacity="0.75"><title>Zone 2: 6:30-6:50 /km</title></rect>
<rect class="lime" x="109.3" y="214" width="140.3" height="14" fill-opacity="0.3"></rect>
<rect class="lime" x="251.6" y="214" width="26.4" height="14" fill-opacity="1"><title>LT1: 5:30-5:40 /km at 152 bpm</title></rect>
<rect class="lime" x="280.0" y="214" width="168.7" height="14" fill-opacity="0.5"></rect>
<rect class="lime" x="450.7" y="214" width="26.4" height="14" fill-opacity="1"><title>LT2: 4:20-4:30 /km at 180 bpm</title></rect>
<rect class="lime" x="479.1" y="214" width="56.9" height="14" fill-opacity="0.65"></rect>
<line x1="427.9" y1="208" x2="427.9" y2="234" stroke="var(--color-ink)" stroke-width="2"><title>Half marathon, predicted: 4:38 /km</title></line>
<line class="lead" x1="80.9" y1="232" x2="80.9" y2="262"/>
<text class="fig" x="24" y="294" font-size="30">6:30-6:50</text>
<text class="lbl" x="24" y="314">Zone 2, easy runs</text>
<line class="lead" x1="427.9" y1="236" x2="427.9" y2="262"/>
<text class="fig" x="427.9" y="294" text-anchor="middle" font-size="30">4:38</text>
<text class="lbl" x="427.9" y="314" text-anchor="middle">Half marathon pace</text>
<text class="mut" x="427.9" y="330" text-anchor="middle">predicted 1:37-1:38</text>
<text class="mut" x="24" y="360">The runs it used</text>
<line class="grid" x1="24" y1="374" x2="536" y2="374"/>
<circle class="run" cx="462" cy="374" r="5"><title>10K race: 4:26 /km, 180 bpm</title></circle>
<text class="lbl" x="468" y="396" text-anchor="end">10K race 4:26, 180 bpm</text>
<circle class="run" cx="499" cy="374" r="5"><title>5K time trial: 4:13 /km, 181 bpm</title></circle>
<text class="lbl" x="536" y="414" text-anchor="end">5K time trial 4:13, 181 bpm</text>
</svg>
