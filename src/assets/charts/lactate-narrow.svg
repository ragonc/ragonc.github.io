<svg id="lact-n" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 343 288" role="img" aria-labelledby="lact-n-t lact-n-d" width="100%">
<title id="lact-n-t">How lactate climbs</title>
<desc id="lact-n-d">The typical lactate curve, not measured data: flat at easy speeds, rising from LT1 (mine 5:30 to 5:40 per km, 152 bpm), climbing steeply after LT2, classically near 4 mmol/L (mine 4:20 to 4:30 per km, 180 bpm). A dashed curve shows the same shape after training, shifted to faster speeds.</desc>
<style>
#lact-n .fig{fill:var(--color-ink);font-family:var(--font-display);font-weight:700}
#lact-n .lbl{fill:var(--color-ink-2);font-family:var(--font-label);font-size:12px}
#lact-n .mut{fill:var(--color-muted);font-family:var(--font-label);font-size:12px}
#lact-n .lime{fill:var(--color-accent)}
#lact-n .lead{stroke:var(--color-ink-2);stroke-opacity:.45;stroke-width:1}
#lact-n .grid{stroke:var(--color-rule);stroke-width:1}
#lact-n .axis{stroke:var(--color-rule-2);stroke-width:1}
#lact-n .run{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:2}
#lact-n .curve{fill:none;stroke:var(--color-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#lact-n .trained{fill:none;stroke:var(--color-ink-2);stroke-opacity:.7;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
#lact-n .tpt{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:2}
#lact-n .pt{fill:var(--color-accent);stroke:var(--color-paper);stroke-width:3}
#lact-n .drop{stroke:var(--color-accent);stroke-opacity:.6;stroke-width:1.5;stroke-dasharray:4 4}
#lact-n .shift{stroke:var(--color-accent);stroke-width:1.5}
#lact-n .head{fill:var(--color-accent)}
</style>
