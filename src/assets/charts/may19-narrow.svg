#may19-n .num.hot{fill:var(--color-ink);font-weight:700}
#may19-n .pace{fill:var(--color-muted);font-family:var(--font-label);font-size:10px}
#may19-n .pace.hot{fill:var(--color-ink);font-weight:700}
#may19-n .note{fill:var(--color-muted);font-family:var(--font-label);font-size:11px}
#may19-n .sign{fill:var(--color-ink);font-family:var(--font-label);font-size:11px;font-weight:700}
#may19-n .lime-t{fill:var(--color-accent);font-family:var(--font-label);font-size:12px}
#may19-n .lt2{stroke:var(--color-muted);stroke-width:1.2;stroke-dasharray:4 4}
#may19-n .back{stroke:var(--color-accent);stroke-width:1.5}
#may19-n .stop{stroke:var(--color-rule-2);stroke-width:1;stroke-dasharray:2 3}
#may19-n .brace{stroke:var(--color-muted);stroke-width:1;fill:none}
#may19-n .ring{fill:none;stroke:var(--color-ink);stroke-width:1.2}
#may19-n .over{stroke:var(--color-ink);stroke-width:2.5}
#may19-n .under{stroke:var(--color-ink-2);stroke-opacity:.5;stroke-width:2}
#may19-n .held{stroke:var(--color-accent);stroke-opacity:.6;stroke-width:2}
#may19-n .d-over{fill:var(--color-ink)}
#may19-n .d-under{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:1.5}
#may19-n .d-held{fill:var(--color-accent)}
#may19-n .d-lt1{fill:var(--color-paper);stroke:var(--color-accent);stroke-width:2}
