<svg id="lact-w" xmlns="http://www.w3.org/2000/svg" viewBox="20 72 520 296" role="img" aria-labelledby="lact-w-t lact-w-d" width="100%">
<title id="lact-w-t">How lactate climbs</title>
<desc id="lact-w-d">The typical lactate curve, not measured data: flat at easy speeds, rising from LT1 (mine 5:30 to 5:40 per km, 152 bpm), climbing steeply after LT2, classically near 4 mmol/L (mine 4:20 to 4:30 per km, 180 bpm). A dashed curve shows the same shape after training, shifted to faster speeds.</desc>
<style>
#lact-w .fig{fill:var(--color-ink);font-family:var(--font-display);font-weight:700}
#lact-w .lbl{fill:var(--color-ink-2);font-family:var(--font-mono);font-size:12px}
#lact-w .mut{fill:var(--color-muted);font-family:var(--font-mono);font-size:12px}
#lact-w .lime{fill:var(--color-accent)}
#lact-w .lead{stroke:var(--color-ink-2);stroke-opacity:.45;stroke-width:1}
#lact-w .grid{stroke:var(--color-rule);stroke-width:1}
#lact-w .axis{stroke:var(--color-rule-2);stroke-width:1}
#lact-w .run{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:2}
#lact-w .curve{fill:none;stroke:var(--color-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#lact-w .trained{fill:none;stroke:var(--color-ink-2);stroke-opacity:.7;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
#lact-w .tpt{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:2}
#lact-w .pt{fill:var(--color-accent);stroke:var(--color-paper);stroke-width:3}
#lact-w .drop{stroke:var(--color-accent);stroke-opacity:.6;stroke-width:1.5;stroke-dasharray:4 4}
#lact-w .shift{stroke:var(--color-accent);stroke-width:1.5}
#lact-w .head{fill:var(--color-accent)}
</style>
