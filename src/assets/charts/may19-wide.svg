#may19-w .lime-t{fill:var(--color-accent);font-family:var(--font-label);font-size:12px}
#may19-w .lt2{stroke:var(--color-muted);stroke-width:1.2;stroke-dasharray:4 4}
#may19-w .back{stroke:var(--color-accent);stroke-width:1.5}
#may19-w .stop{stroke:var(--color-rule-2);stroke-width:1;stroke-dasharray:2 3}
#may19-w .brace{stroke:var(--color-muted);stroke-width:1;fill:none}
#may19-w .ring{fill:none;stroke:var(--color-ink);stroke-width:1.2}
#may19-w .over{stroke:var(--color-ink);stroke-width:2.5}
#may19-w .under{stroke:var(--color-ink-2);stroke-opacity:.5;stroke-width:2}
#may19-w .held{stroke:var(--color-accent);stroke-opacity:.6;stroke-width:2}
#may19-w .d-over{fill:var(--color-ink)}
#may19-w .d-under{fill:var(--color-paper);stroke:var(--color-ink-2);stroke-width:1.5}
#may19-w .d-held{fill:var(--color-accent)}
