<svg id="may19-w" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 452" role="img" aria-labelledby="may19-w-t may19-w-d" width="100%">
<title id="may19-w-t">19 May, what I ran and what a coach would have called</title>
<desc id="may19-w-d">Average heart rate per rep, 12 x 800 m at 10K pace minus 10 s on 19 May 2026, against a back-off line at 178 bpm and LT2 at 180. What I ran: reps 1 and 2 were the ramp-up, at 4:48 and 4:43, yet rep 2 already averaged 179: the sign of a bad day. Reps 3 to 6 went on at 181 to 183, then a long stop, and rep 7 broke at 5:28 per km; reps 10 to 12 went over the line again. Coached, estimated from that day's heart rate: called at rep 2, rep 3 at LT1 pace 5:35 and about 172 bpm, then reps 4 to 12 at 5:10 per km, all at or under 178.</desc>
